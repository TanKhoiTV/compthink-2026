name: Deploy Server (HF Spaces)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/deploy-server.yml"

  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Push to HF Space
        run: |
          git remote add hfspace https://huggingface.co/spaces/khoinguyentran/trekkopoly-old-server
          git push hfspace main:main --force
        env:
          GIT_HTTP_PASSWORD: ${{ secrets.HF_TOKEN }}

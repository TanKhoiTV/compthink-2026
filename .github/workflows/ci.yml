name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build

      - name: Verify server entry
        run: node --eval "import('./server/index.ts')" 2>&1 || echo "Server requires tsx at runtime (OK for build check)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: |
            build/
            index.html
            sw.js
            manifest.json
            assets/
